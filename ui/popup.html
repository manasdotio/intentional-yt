<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Intentional YT</title>
  <link rel="stylesheet" href="../styles/popup.css" />
</head>
<body>
<div id="shell">

  <!-- Header -->
  <div id="hd">
    <img src="../icons/icon.png" alt="" class="hd-icon" />
    <span class="hd-name">Intentional YT</span>
    <span id="ext-badge">Active</span>
    <input type="checkbox" class="chk" id="toggle-extensionEnabled" />
  </div>

  <!-- Controls -->
  <div id="scroll">

    <!-- Feed -->
    <div class="sh"><span class="sh-label">Feed</span></div>
    <div class="rows">
      <label class="row"><span class="row-text">Hide home feed</span><input type="checkbox" class="chk" id="toggle-blockHomeFeed" /></label>
      <label class="row"><span class="row-text">Hide subscriptions</span><input type="checkbox" class="chk" id="toggle-blockSubscriptionsFeed" /></label>
      <label class="row"><span class="row-text">Hide recommended sidebar</span><input type="checkbox" class="chk" id="toggle-blockRecommended" /></label>
      <label class="row"><span class="row-text">Hide Shorts</span><input type="checkbox" class="chk" id="toggle-blockShorts" /></label>
      <label class="row"><span class="row-text">Hide Explore &amp; Trending</span><input type="checkbox" class="chk" id="toggle-blockExploreAndTrending" /></label>
      <label class="row"><span class="row-text">Hide "More from YouTube"</span><input type="checkbox" class="chk" id="toggle-blockMoreFromYouTube" /></label>
      <label class="row"><span class="row-text">Hide irrelevant search shelves</span><input type="checkbox" class="chk" id="toggle-blockIrrelevantSearchResults" /></label>
    </div>

    <!-- Video -->
    <div class="sh"><span class="sh-label">Video</span></div>
    <div class="rows">
      <label class="row"><span class="row-text">Hide end screen recommendations</span><input type="checkbox" class="chk" id="toggle-blockEndScreenVideowall" /></label>
      <label class="row"><span class="row-text">Hide end screen cards</span><input type="checkbox" class="chk" id="toggle-blockEndScreenCards" /></label>
      <label class="row"><span class="row-text">Hide live chat</span><input type="checkbox" class="chk" id="toggle-blockLiveChat" /></label>
      <label class="row"><span class="row-text">Hide playlist panel</span><input type="checkbox" class="chk" id="toggle-blockPlaylist" /></label>
      <label class="row"><span class="row-text">Disable autoplay</span><input type="checkbox" class="chk" id="toggle-disableAutoplay" /></label>
      <label class="row"><span class="row-text">Hide annotations</span><input type="checkbox" class="chk" id="toggle-disableAnnotations" /></label>
      <label class="row"><span class="row-text">Hide video info panel</span><input type="checkbox" class="chk" id="toggle-blockVideoInfo" /></label>
      <div id="video-info-children" style="display:none">
        <label class="row sub"><span class="row-text">Action buttons</span><input type="checkbox" class="chk" id="toggle-blockVideoButtons" /></label>
        <label class="row sub"><span class="row-text">Channel info</span><input type="checkbox" class="chk" id="toggle-blockChannelInfo" /></label>
        <label class="row sub"><span class="row-text">Description</span><input type="checkbox" class="chk" id="toggle-blockVideoDescription" /></label>
      </div>
    </div>

    <!-- Social -->
    <div class="sh"><span class="sh-label">Social</span></div>
    <div class="rows">
      <label class="row"><span class="row-text">Hide comments</span><input type="checkbox" class="chk" id="toggle-blockComments" /></label>
      <label class="row"><span class="row-text">Hide commenter photos</span><input type="checkbox" class="chk" id="toggle-blockProfilePhotos" /></label>
    </div>

    <!-- Interface -->
    <div class="sh"><span class="sh-label">Interface</span></div>
    <div class="rows">
      <label class="row"><span class="row-text">Hide left sidebar</span><input type="checkbox" class="chk" id="toggle-blockSidebar" /></label>
      <label class="row"><span class="row-text">Hide top header</span><input type="checkbox" class="chk" id="toggle-blockTopHeader" /></label>
      <label class="row"><span class="row-text">Hide notification bell</span><input type="checkbox" class="chk" id="toggle-blockNotificationBell" /></label>
      <label class="row"><span class="row-text">Hide merch &amp; offers</span><input type="checkbox" class="chk" id="toggle-blockMerch" /></label>
      <label class="row"><span class="row-text">Hide mix playlists</span><input type="checkbox" class="chk" id="toggle-blockMixPlaylists" /></label>
    </div>

    <!-- Appearance -->
    <div class="sh"><span class="sh-label">Appearance</span></div>
    <div class="rows">
      <label class="row"><span class="row-text">Hide thumbnails</span><input type="checkbox" class="chk" id="toggle-hideThumbnails" /></label>
      <label class="row"><span class="row-text">Grayscale</span><input type="checkbox" class="chk" id="toggle-grayscaleMode" /></label>
    </div>

    <!-- Time -->
    <div class="sh"><span class="sh-label">Time</span></div>
    <div class="rows">
      <label class="row"><span class="row-text">Soft reminder</span><input type="checkbox" class="chk" id="toggle-softReminder" /></label>
      <div class="time-expand" id="soft-reminder-expand">
        <span class="time-hint">Every</span>
        <select class="time-sel" id="select-softReminderInterval">
          <option value="15">15 min</option>
          <option value="30">30 min</option>
          <option value="45">45 min</option>
          <option value="60">60 min</option>
          <option value="90">90 min</option>
          <option value="custom">Custom...</option>
        </select>
        <div class="custom-time-wrap" id="soft-reminder-custom-wrap" style="display:none">
          <input type="number" class="time-input" id="input-softReminderCustom" min="1" max="1440" placeholder="min" />
          <span class="time-unit">min</span>
        </div>
      </div>
      <label class="row"><span class="row-text">Daily limit</span><input type="checkbox" class="chk" id="toggle-dailyLimit" /></label>
      <div class="time-expand" id="daily-limit-expand">
        <span class="time-hint">Stop after</span>
        <select class="time-sel" id="select-dailyLimitMinutes">
          <option value="15">15 min</option>
          <option value="30">30 min</option>
          <option value="45">45 min</option>
          <option value="60">60 min</option>
          <option value="90">90 min</option>
          <option value="120">120 min</option>
          <option value="custom">Custom...</option>
        </select>
        <div class="custom-time-wrap" id="daily-limit-custom-wrap" style="display:none">
          <input type="number" class="time-input" id="input-dailyLimitCustom" min="1" max="1440" placeholder="min" />
          <span class="time-unit">min</span>
        </div>
      </div>
    </div>

  </div><!-- /#scroll -->

  <!-- Stats -->
  <div id="stats">
    <div class="stats-header">
      <span class="stats-title">Today</span>
      <span class="iyt-tooltip-wrap">
        <span class="iyt-info-icon" aria-label="About daily watchtime">ⓘ</span>
        <span class="iyt-tooltip-text">Tracks how many minutes you've watched YouTube today. Resets automatically at midnight. Use the daily limit toggle above to cap your session.</span>
      </span>
    </div>
    <div class="stats-row">
      <span id="stats-time">0 min</span>
      <div class="stats-meta">
        <span id="stats-limit-label">no limit</span>
        <button id="stats-reset">reset</button>
      </div>
    </div>
    <div class="prog"><div id="prog-fill"></div></div>
  </div>

  <!-- Footer -->
  <div id="footer">
    <span>No data leaves your browser</span>
    <span>v2.0.1</span>
  </div>

</div>
<script src="../utils/storage.js"></script>
<script src="popup.js"></script>
</body>
</html>
