name: Release Extension Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Zip & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Extension
        run: |
          chmod +x ./package.sh
          ./package.sh "intentional-yt-${{ github.ref_name }}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: intentional-yt-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
