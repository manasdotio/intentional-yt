      <h1>Intentional YT — Distraction-Free YouTube Extension</h1>
      <p>
        <strong>Turn YouTube into a mindful focus tool, not an algorithm trap.</strong> Intentional YT is a 100% private, zero-flash browser extension engineered to eliminate distraction surfaces, endless recommendations, clickbait thumbnails, and YouTube Shorts.
      </p>

      <h2>Key Features</h2>
      <ul>
        <li><strong>Zero-Flash DOM Ingestion:</strong> Injects styles at <code>document_start</code> before page paint to eliminate visual flicker and layout jump.</li>
        <li><strong>Complete YouTube Shorts Suppression:</strong> Removes Shorts shelves, sidebar tabs, channel tabs, search carousels, and player links.</li>
        <li><strong>20+ Granular Independent Toggles:</strong> Customize your environment freely—keep subscriptions and notifications while hiding recommendations.</li>
        <li><strong>Clickbait Thumbnail De-stimulation:</strong> Grays out or blurs screaming thumbnails while preserving duration timestamps.</li>
        <li><strong>Daily Watch Timer &amp; Limits:</strong> Built-in active playback tracker with gentle nudge toasts and custom daily limits.</li>
        <li><strong>Strict 0% Telemetry:</strong> No external network calls, tracking scripts, or analytics. All settings stay 100% local.</li>
      </ul>

        <a href="https://addons.mozilla.org/en-US/firefox/addon/intentional-yt/"><strong>Install from Mozilla Firefox Add-ons (AMO)</strong></a><br />
        <a href="https://github.com/manasdotio/intentional-yt"><strong>View Source Code on GitHub</strong></a> (MIT Licensed Open Source)
      </p>

      <h2>Frequently Asked Questions</h2>
      <h3>How does Intentional YT achieve zero-flash blocking?</h3>
      <p>Traditional blockers wait for the DOM to parse, causing distracting elements to flash for 100–300ms. Intentional YT injects high-specificity CSS tokens at document_start before paint, guaranteeing 0ms layout lag and zero pop-in.</p>
      
      <h3>Can I block YouTube Shorts completely?</h3>
      <p>Yes. Intentional YT completely suppresses Shorts shelves, sidebar tabs, channel tabs, and search results.</p>
      
      <h3>Is Intentional YT private and free?</h3>
      <p>Yes. It is 100% free, open-source under the MIT license, and collects strictly zero telemetry or browsing data.</p>
