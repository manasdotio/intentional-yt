<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Focus Arc Gradient -->
    <linearGradient id="focusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- YouTube Red Accent -->
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- 1. Outer Focus Reticle Track (Transparent Base) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#2563EB" stroke-width="24"/>

  <!-- 2. Active Focus Arc (Top Quadrant Highlight) -->
  <path d="M 256 46 A 210 210 0 0 1 466 256" fill="none" stroke="url(#focusGrad)" stroke-width="28" stroke-linecap="round"/>

  <!-- 3. Precision Quadrant Focus Ticks -->
  <line x1="256" y1="30" x2="256" y2="62" stroke="#60A5FA" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="450" x2="256" y2="482" stroke="#2563EB" stroke-width="12" stroke-linecap="round"/>
  <line x1="30" y1="256" x2="62" y2="256" stroke="#60A5FA" stroke-width="12" stroke-linecap="round"/>
  <line x1="450" y1="256" x2="482" y2="256" stroke="#2563EB" stroke-width="12" stroke-linecap="round"/>

  <!-- 4. Playmark Base Badge (Vibrant YouTube Focus Shield) -->
  <path d="M 210 162 C 210 152 221 146 229 151 L 340 245 C 347 250 347 262 340 267 L 229 361 C 221 366 210 360 210 350 Z" 
        fill="url(#ytRed)"/>

  <!-- 5. Inner Porcelain Playmark (Optically Centered Crisp White) -->
  <path d="M 226 186 C 226 180 233 176 238 180 L 316 250 C 321 254 321 262 316 266 L 238 336 C 233 340 226 336 226 330 Z" 
        fill="#FFFFFF"/>
</svg>
